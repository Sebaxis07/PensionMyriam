# Config mínima del Sprint 0 — solo lo necesario para el criterio de
# cierre (una escritura offline en `habitacion` llega a Postgres).
# Cada sprint agrega sus propias tablas y buckets aquí junto con las
# reglas de acceso por rol.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DB_URI
      # Sin esto, el default es sslmode: verify-full — nuestro Postgres no
      # tiene TLS configurado (red interna de Docker), así que la conexión
      # nunca llega a negociar y falla sin dejar rastro en los logs de
      # Postgres.
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_DB_URI
  sslmode: disable

client_auth:
  # PowerSync valida el mismo JWT (HS256) que emite GoTrue. `supabase: true`
  # activa el colector de clave estática pensado para este caso: fija la
  # audiencia en "authenticated" y la vida máxima en 1 semana + margen,
  # igual que GOTRUE_JWT_AUD / GOTRUE_JWT_EXP. No existe un campo genérico
  # `secret` ni `jwks.static` en este servicio (v1.26.1).
  supabase: true
  supabase_jwt_secret: !env PS_JWT_SECRET

sync_rules:
  content: |
    bucket_definitions:
      # Sprint 1: ciclo de vida de habitaciones completo. Un solo bucket
      # global (ambos roles ven y operan lo mismo del día a día — la
      # separación por rol empieza en Sprint 2 con insumo/compra_insumo,
      # decisión E). No incluye trabajador/contrato_empresa/consumo:
      # llegan con Sprint 2 (EP-03), Sprint 1 no los usa.
      operacion:
        data:
          # `usuario` SALIÓ de este bucket global (Sprint 5, HU-36): ver
          # los buckets usuario_propio_encargada / usuario_directorio_
          # administradora más abajo. El comentario que estaba acá decía
          # "solo lectura de la propia fila", pero el select no filtraba
          # nada: replicaba la tabla COMPLETA (nombre, rol y, desde
          # 0017, el correo de todas las cuentas) al celular de la
          # Encargada. PowerSync bypassa la RLS de Postgres al replicar,
          # así que la policy usuario_select ("su propia fila, o todas
          # si es administradora") no intervenía en absoluto. HU-36 pide
          # justamente lo contrario: que la gestión de cuentas no esté
          # al alcance de la Encargada.
          - select * from habitacion
          - select * from cama
          - select * from reserva
          - select * from checkin
          # checkout no tiene columna "id" propia: su PK es checkin_id
          # (1:1 con checkin, ver 0001_init.sql). PowerSync necesita un
          # campo "id" para identificar la fila — se alias explícito.
          - select checkin_id as id, checkin_id, realizado_por, fecha_hora, uuid_idempotente from checkout
          - select * from aseo
          # Sprint 2 (EP-03): todo lo operativo de empresas/consumo que
          # NO es sensible. contrato_empresa se sacó COMPLETO de este
          # bucket — ver bucket "contrato_empresa_por_rol" más abajo:
          # tenerlo acá A LA VEZ con una versión parcial en otro bucket
          # (como estaba antes, con columnas explícitas excluyendo
          # tarifa_convenida) causaba que la MISMA fila (mismo id)
          # llegara desde dos buckets con dos formas de columnas
          # distintas — PowerSync no fusiona esas dos entregas, aplica
          # la última como reemplazo COMPLETO de la fila, dejando en
          # null cualquier columna que esa entrega no incluyera. Se
          # detectó así: la Administradora veía tarifa_convenida
          # correcta pero empresa_id/vigencia_desde/headcount en null
          # (la tarjeta de empresa mostraba "Sin contrato" pese a tener
          # uno). Única fuente de verdad por fila = un solo bucket por
          # rol, nunca dos buckets tocando la misma tabla a la vez.
          - select * from empresa
          - select * from trabajador
          - select * from consumo
          - select * from conciliacion_diaria
          - select * from justificacion_descuadre
          - select * from producto_extra
          - select * from tipo_consumo_config
          # Migración 0026, sección 8 del alcance: auditoría de ajustes
          # de cantidad contratada. No lleva montos ($), solo
          # cantidades y el motivo tipificado — a diferencia de
          # contrato_empresa, SÍ es una fuente única para ambos roles
          # (misma fila completa en los dos celulares, como el resto de
          # este bucket global). En Postgres, la RLS de todas formas
          # solo permite INSERT a la Administradora.
          - select * from contrato_empresa_ajuste
          # Sprint 5 (HU-39): parámetros del negocio (contacto, tarifa
          # base, datos de transferencia). Los leen los dos celulares
          # porque el voucher PDF y el mensaje de WhatsApp se arman desde
          # la réplica local, también sin señal. No contiene costos ni
          # márgenes; editarla sigue siendo exclusivo de la
          # Administradora (policy config_negocio_update).
          - select * from config_negocio
          # Sprint 4 (EP-04): insumo/compra_insumo ya estaban
          # correctamente restringidos solo a Administradora por RLS en
          # Postgres (decisión E), pero PowerSync los replica a TODOS
          # los dispositivos igual (bypassa RLS) — mismo defecto que
          # tarifa_convenida, nunca se había verificado hasta ahora. Se
          # mueven a un bucket parametrizado por rol (costos_insumos).

      # contrato_empresa completo, UNA sola fuente por rol (nunca dos
      # buckets a la vez para la misma tabla — ver el comentario en
      # "operacion" arriba sobre por qué eso rompe la fila entera, no
      # solo la columna sensible). Cada dispositivo recibe exactamente
      # uno de estos dos buckets según su rol real en la tabla usuario
      # (lookup vía request.user_id(), el "sub" del JWT) — la Encargada
      # nunca recibe tarifa_convenida, ni siquiera como columna
      # presente en null; a la Administradora SÍ le llega el valor
      # real. PowerSync bypassa RLS de Postgres al replicar (rol propio
      # BYPASSRLS): esta es la única barrera real contra ese bypass.
      contrato_empresa_encargada:
        parameters: SELECT 1 as puede_ver FROM usuario WHERE usuario.auth_uid = request.user_id() AND usuario.rol = 'encargada'
        data:
          - SELECT id, empresa_id, vigencia_desde, vigencia_hasta, headcount, creado_por, created_at FROM contrato_empresa WHERE bucket.puede_ver = 1

      # Migración 0026: incluye_desayuno/incluye_almuerzo/incluye_cena y
      # condicion_tributaria son la misma condición económica
      # confidencial que tarifa_convenida (describen la tarifa pactada,
      # no datos operativos) — mismo tratamiento: solo administradora.
      contrato_empresa_administradora:
        parameters: SELECT 1 as puede_ver FROM usuario WHERE usuario.auth_uid = request.user_id() AND usuario.rol = 'administradora'
        data:
          - SELECT id, empresa_id, vigencia_desde, vigencia_hasta, headcount, tarifa_convenida, incluye_desayuno, incluye_almuerzo, incluye_cena, condicion_tributaria, creado_por, created_at FROM contrato_empresa WHERE bucket.puede_ver = 1

      # usuario (Sprint 5, HU-36). Dos buckets MUTUAMENTE EXCLUYENTES
      # por rol — nunca los dos a la vez para la misma tabla, por la
      # razón explicada en el comentario de "operacion" sobre
      # contrato_empresa (dos entregas de la misma fila se reemplazan
      # entre sí en vez de fusionarse).
      #
      # La Encargada recibe EXACTAMENTE su propia fila, que es todo lo
      # que la app necesita de esta tabla para funcionar offline:
      # resolver su `usuario.id` y completar realizado_por / responsable
      # / creado_por al escribir. No recibe el directorio de cuentas.
      usuario_propio_encargada:
        parameters: SELECT usuario.auth_uid as propio FROM usuario WHERE usuario.auth_uid = request.user_id() AND usuario.rol = 'encargada'
        data:
          - SELECT * FROM usuario WHERE usuario.auth_uid = bucket.propio

      # La Administradora sí recibe el directorio completo: es el dato
      # que muestra la pestaña Cuentas (HU-36: nombre, correo, rol y
      # fecha de registro) y tiene que poder consultarlo sin señal.
      usuario_directorio_administradora:
        parameters: SELECT 1 as puede_ver FROM usuario WHERE usuario.auth_uid = request.user_id() AND usuario.rol = 'administradora'
        data:
          - SELECT * FROM usuario WHERE bucket.puede_ver = 1

      # cierre_facturacion (Sprint 5, HU-33): lleva total_facturado, que
      # es dato financiero — mismo criterio que tarifa_convenida y los
      # costos de insumos (decisión E de CLAUDE.md). Solo Administradora.
      cierre_facturacion_administradora:
        parameters: SELECT 1 as puede_ver FROM usuario WHERE usuario.auth_uid = request.user_id() AND usuario.rol = 'administradora'
        data:
          - SELECT * FROM cierre_facturacion WHERE bucket.puede_ver = 1

      # insumo/compra_insumo (Sprint 4, HU-22/23): costos de mercadería
      # y PMP — "la Encargada no ve costos ni márgenes" (CLAUDE.md,
      # decisión E). Mismo patrón que empresa_tarifas.
      costos_insumos:
        parameters: SELECT 1 as puede_ver FROM usuario WHERE usuario.auth_uid = request.user_id() AND usuario.rol = 'administradora'
        data:
          - SELECT * FROM insumo WHERE bucket.puede_ver = 1
          - SELECT * FROM compra_insumo WHERE bucket.puede_ver = 1
