# Config mínima del Sprint 0 — solo lo necesario para el criterio de
# cierre (una escritura offline en `habitacion` llega a Postgres).
# Cada sprint agrega sus propias tablas y buckets aquí junto con las
# reglas de acceso por rol.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DB_URI
      # Sin esto, el default es sslmode: verify-full — nuestro Postgres no
      # tiene TLS configurado (red interna de Docker), así que la conexión
      # nunca llega a negociar y falla sin dejar rastro en los logs de
      # Postgres.
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_DB_URI
  sslmode: disable

client_auth:
  # PowerSync valida el mismo JWT (HS256) que emite GoTrue. `supabase: true`
  # activa el colector de clave estática pensado para este caso: fija la
  # audiencia en "authenticated" y la vida máxima en 1 semana + margen,
  # igual que GOTRUE_JWT_AUD / GOTRUE_JWT_EXP. No existe un campo genérico
  # `secret` ni `jwks.static` en este servicio (v1.26.1).
  supabase: true
  supabase_jwt_secret: !env PS_JWT_SECRET

sync_rules:
  content: |
    bucket_definitions:
      # Sprint 1: ciclo de vida de habitaciones completo. Un solo bucket
      # global (ambos roles ven y operan lo mismo del día a día — la
      # separación por rol empieza en Sprint 2 con insumo/compra_insumo,
      # decisión E). No incluye trabajador/contrato_empresa/consumo:
      # llegan con Sprint 2 (EP-03), Sprint 1 no los usa.
      operacion:
        data:
          # Solo lectura de la propia fila: la app la usa para resolver
          # su usuario.id (no auth_uid) al escribir realizado_por /
          # responsable / creado_por sin depender de la red.
          - select * from usuario
          - select * from habitacion
          - select * from cama
          - select * from reserva
          - select * from checkin
          # checkout no tiene columna "id" propia: su PK es checkin_id
          # (1:1 con checkin, ver 0001_init.sql). PowerSync necesita un
          # campo "id" para identificar la fila — se alias explícito.
          - select checkin_id as id, checkin_id, realizado_por, fecha_hora, uuid_idempotente from checkout
          - select * from aseo
          # Sprint 2 (EP-03): todo lo operativo de empresas/consumo que
          # NO es sensible. tarifa_convenida se sincroniza aparte, solo
          # a administradora (bucket empresa_tarifas, abajo) — PowerSync
          # replica vía su propio rol de replicación (BYPASSRLS), así
          # que RLS de Postgres NUNCA filtra lo que llega al celular;
          # el único control real de qué columna recibe cada rol es la
          # lista de columnas de este archivo. Por eso tarifa_convenida
          # se excluye explícitamente acá (columnas nombradas, no
          # "select *") — este comentario describía esta separación
          # desde antes, pero el bucket nunca se había implementado:
          # "select * from contrato_empresa" seguía sincronizando
          # tarifa_convenida a cualquier rol. Corregido (auditoría de
          # seguridad): ver también la vista contrato_empresa_rest y el
          # GRANT de 0015_seguridad_tarifa.sql para la vía de
          # PostgREST/consultas directas, que esto NO cubre por sí solo.
          - select * from empresa
          - select id, empresa_id, vigencia_desde, vigencia_hasta, headcount, creado_por, created_at from contrato_empresa
          - select * from trabajador
          - select * from consumo
          - select * from conciliacion_diaria
          - select * from justificacion_descuadre
          - select * from producto_extra
          - select * from tipo_consumo_config
          # Sprint 4 (EP-04): insumo/compra_insumo ya estaban
          # correctamente restringidos solo a Administradora por RLS en
          # Postgres (decisión E), pero PowerSync los replica a TODOS
          # los dispositivos igual (bypassa RLS) — mismo defecto que
          # tarifa_convenida, nunca se había verificado hasta ahora. Se
          # mueven a un bucket parametrizado por rol (costos_insumos).

      # Único dato financiero de contrato_empresa — solo llega al
      # dispositivo cuyo JWT resuelve a rol "administradora" en la
      # tabla usuario (lookup vía request.user_id(), el "sub" del JWT).
      # Bucket "global" (sin parámetro por fila): para una Encargada,
      # user_role nunca es 'administradora', así que esta Data Query no
      # le entrega ninguna fila — ni siquiera el id, nunca llega al
      # SQLite local de su teléfono.
      empresa_tarifas:
        parameters: SELECT rol as user_role FROM usuario WHERE usuario.auth_uid = request.user_id()
        data:
          - SELECT id, tarifa_convenida FROM contrato_empresa WHERE bucket.user_role = 'administradora'

      # insumo/compra_insumo (Sprint 4, HU-22/23): costos de mercadería
      # y PMP — "la Encargada no ve costos ni márgenes" (CLAUDE.md,
      # decisión E). Mismo patrón que empresa_tarifas.
      costos_insumos:
        parameters: SELECT rol as user_role FROM usuario WHERE usuario.auth_uid = request.user_id()
        data:
          - SELECT * FROM insumo WHERE bucket.user_role = 'administradora'
          - SELECT * FROM compra_insumo WHERE bucket.user_role = 'administradora'
